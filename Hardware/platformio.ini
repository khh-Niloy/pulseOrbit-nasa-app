[platformio]
src_dir = src

; PlatformIO Project Configuration File

[env:d1_mini]
platform = espressif8266@^4.2.1
board = d1_mini
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_src_flags =
    -Wall
    -Wextra
    -Wformat=2
    -Werror=return-type

; Diagnostics emitted by the ESP8266 core and PubSubClient.  These need to be
; global because those packages are compiled separately from src/.
build_flags =
    -Wno-sign-compare
    -Wno-format-nonliteral
    -Wno-format-security

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
